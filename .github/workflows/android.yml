name: Build LiveCraft APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/tiktok-rust-bridge", "fix/piratetok-event-stream", "fix/tiktok-username-config", "feature/separate-connection-controls", "fix/live-search-crash", "diagnose/native-start-checkpoints", "feature/new-tiktok-gift-rules", "feature/gift-editor", "feature/text-overlay-from-133", "feature/mob-mode", "feature/mob-command-confirmation", "feature/custom-mob-delay", "feature/custom-like-goal", "feature/like-trigger-no-counter", "feature/gift-combo-per-item" ]
  pull_request:
    branches: [ "fix/piratetok-event-stream" ]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK, platform and NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager não encontrado em $ANDROID_HOME"; exit 1; fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "ndk;27.2.12479018"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build TikTok native connector
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cd native/jni
          cargo ndk -t arm64-v8a -o ../../app/src/main/jniLibs build --release
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run gift rule tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveCraft-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gift-editor-build-${{ github.run_number }}
          name: LiveCraft Gift Editor build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
